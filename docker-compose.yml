# The project name scopes the volume holding the browser profile — and that
# profile holds the claude.ai login. Renaming it orphans the volume and the
# login has to be done again.
name: claude-usage-mcp

services:
  # Holds the login. You open its UI once, log in by hand, and leave it running.
  # No password on that UI, so keep the ports off untrusted networks — bind them
  # to 127.0.0.1 if this host shares a network you don't control.
  browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: claude-usage-browser
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
      - CHROME_CLI=--remote-debugging-port=9222
    volumes:
      - browser-profile:/config
    ports:
      - "3000:3000"   # the UI you log in through (HTTP, use from localhost)
      - "3001:3001"   # same UI over HTTPS, for reaching it from another machine
      # 9222 on the host either way, so the checker needs no reconfiguring
      # whether the browser is this container or one you started yourself.
      - "9222:9223"   # how usage.py talks to this browser, via the bridge below
    shm_size: "1gb"
    restart: unless-stopped

  # Chromium only ever listens for debugger connections on its own 127.0.0.1 and
  # ignores --remote-debugging-address, so nothing outside the container can
  # reach it. Sharing the browser's network namespace makes that loopback
  # reachable without exposing anything else.
  cdp-bridge:
    image: alpine/socat
    container_name: claude-usage-cdp
    network_mode: "service:browser"
    command: TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
    depends_on:
      - browser
    restart: unless-stopped

volumes:
  browser-profile:
