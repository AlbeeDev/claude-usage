# The project name scopes the volume holding the browser profile — and that
# profile holds the claude.ai login. Renaming it orphans the volume and the
# login has to be done again. Kept as "usage-check" from where this started.
name: usage-check

services:
  # Holds the login. You open its UI once, log in by hand, and leave it alone.
  # No password on that UI, so keep the port off untrusted networks — bind it to
  # 127.0.0.1:5800 instead if the host shares a network you don't control.
  firefox:
    image: jlesage/firefox
    container_name: usage-check-firefox
    ports:
      - "5800:5800"
    environment:
      - DISPLAY_WIDTH=1280
      - DISPLAY_HEIGHT=800
      - KEEP_APP_RUNNING=1
    volumes:
      - firefox-profile:/config
    restart: unless-stopped

  # Stores whatever the userscript pushes. Only useful with the push path set
  # up; harmless otherwise.
  collector:
    image: python:3-alpine
    container_name: usage-check-collector
    command: python3 /collector.py
    ports:
      - "8000:8000"
    volumes:
      - ./collector.py:/collector.py:ro
      - ./data:/data
    restart: unless-stopped

volumes:
  firefox-profile:
