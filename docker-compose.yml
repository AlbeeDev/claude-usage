# The project name scopes the volume holding the browser profile — and that
# profile holds the claude.ai login. Renaming it orphans the volume and the
# login has to be done again.
name: claude-usage

services:
  # Holds the login. You open its UI once, log in by hand, and leave it running.
  #
  # Everything binds to 127.0.0.1, because that UI has no password and the
  # browser behind it is signed into your account. Published on 0.0.0.0 it would
  # be reachable from the internet on any host with a public address, which is
  # most of the machines this gets run on. Reach it from elsewhere with a tunnel:
  #     ssh -L 3000:localhost:3000 you@host
  browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: claude-usage-browser
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=0
      - PGID=0
      - TZ=Etc/UTC
      # about:blank on purpose: the image's default start page is a live
      # DuckDuckGo page, and one left open for a week reached 1.7GB on its
      # own. Nothing here needs a start page.
      - CHROME_CLI=--remote-debugging-port=9222 about:blank
    volumes:
      - browser-profile:/config
    ports:
      - "127.0.0.1:3000:3000"   # the UI you log in through
      - "127.0.0.1:3001:3001"   # the same UI over HTTPS, if you want it
      # 9222 on the host either way, so the checker needs no reconfiguring
      # whether the browser is this container or one you started yourself.
      - "127.0.0.1:9222:9223"   # how usage.py talks to this browser
    shm_size: "1gb"
    restart: unless-stopped

  # Chromium only ever listens for debugger connections on its own 127.0.0.1 and
  # ignores --remote-debugging-address, so nothing outside the container can
  # reach it. Sharing the browser's network namespace makes that loopback
  # reachable without exposing anything else.
  cdp-bridge:
    image: alpine/socat
    container_name: claude-usage-cdp
    network_mode: "service:browser"
    command: TCP-LISTEN:9223,fork,reuseaddr TCP:127.0.0.1:9222
    depends_on:
      browser:
        condition: service_started
        # Sharing a namespace means sharing its lifetime: when the browser
        # restarts it gets a new one, and a bridge left in the old one listens
        # where nothing can reach it. Restarting alongside keeps them together.
        restart: true
    restart: unless-stopped

volumes:
  browser-profile:
